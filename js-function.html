<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Funtions</title>
</head>
<body>
    <h1>Javascript Function Demo</h1>

    <p>This page demonstrate javascript function</p>

    <!-- Button to trigger the results -->
     <button onclick="runStandardFunction()">Run Standard Function (Add 3+10)</button>
     <button onclick="runArrowFunction()">Run Arrow Function (Add 3+10)</button>
     
     <br>
     <br>

    <div id="result">The result will appear here..</div>

    <script>
        const outputDiv = document.getElementById('result');


        //Standard Function
        function addNumbers(a, b){
            return a + b;
        }
        //Arrow Function
        const addArrow = (a, b) => a + b;

        //Wrapper Function
        function runStandardFunction(){
            const result = addNumbers(3, 10);
            outputDiv.innerHTML = "<strong>Standard Function Result: </strong>" + result;
        }
        //Wrapper Arrow Function
        const runArrowFunction = () => {
            const result = addArrow(3, 10);
            outputDiv.innerHTML = "<strong>Arrow Function Result: </strong>" + result;
        }

    </script>
</body>
</html>
